<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaSport - Hackathon</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Propio -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏃‍♂️ JavaSport</a>
                <button class="btn btn-outline-info" type="button" id="btn-carrito" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                    🛒 Carrito (<span id="contador-carrito">0</span>) </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section text-center py-5 text-white bg-primary bg-gradient">
        <div class="container py-4">
            <h1 class="display-4 fw-bold">Equípate para ganar</h1>
            <p class="lead">Los mejores artículos deportivos con tecnología de punta.</p>
        </div>
    </header>

    <!-- Productos Section -->
    <main class="container my-5">
        <h2 class="text-center mb-5">Nuestros Productos</h2>
        <!-- Contenedor donde JS inyectará las tarjetas -->
        <div class="row" id="contenedor-productos">
            <!-- Las tarjetas se generan dinámicamente aquí -->
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">Proyecto Hackathon © 2026 - JavaSport</p>
    </footer>

    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="modalCarritoLabel">🛒 Tu Carrito de Compras</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-carrito">
                        </tbody>
                </table>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <h5 class="fw-bold">Total: $<span id="total-carrito">0.00</span></h5>
                <button type="button" class="btn btn-success">Proceder al Pago</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts (Orden modular estricto) -->
    <!-- 1. Base de datos -->
    <script src="js/productos.js"></script>
    <!-- 2. Lógica de guardado y carrito -->
    <script src="js/carrito.js"></script>
    <!-- 3. Interfaz y renderizado final -->
    <script src="js/app.js"></script>
</body>
</html>
